schema_version: '1.0'
name: draws-an-undirected-network
description: 'Who knows whom, which has no direction, is answered with a block of -- links.'
tags: [draw]
execution:
  prompt: |
    Ana knows Ben and Cy. Ben knows Cy and Dee. Dee knows Eli. Who could introduce Ana to Eli? Show me who knows whom.
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: []
  env:
    EVAL_GRAPHLET_GUIDE: '1'
runs: 3
graders:
  - type: regex
    name: writes-a-graph-block
    pattern: '^[ \t]*```graphlet[ \t]*$'
    flags: 'm'
    match: 'contains'
  - type: regex
    name: introduces-the-graph
    pattern: '^\s*[^\s`]'
    flags: ''
    match: 'contains'
  - type: regex
    name: block-is-closed-with-a-dashed-link
    pattern: '^[ \t]*```graphlet[ \t]*\n(?:(?![ \t]*```)[^\n]*\n)*?[^\n]*[ \t]-{2,}(?=[ \t|])[^\n]*\n(?:(?![ \t]*```)[^\n]*\n)*?[ \t]*```[ \t]*$'
    flags: 'm'
    match: 'contains'
  - type: regex
    name: no-arrows-among-the-dashes
    pattern: '```graphlet(?=(?:(?!```)[\s\S])*?[ \t]-{2,}[ \t|])(?=(?:(?!```)[\s\S])*?(?:->|→|↔|<-|←))'
    flags: ''
    match: 'not_contains'
  - type: regex
    name: no-group-for-what-has-no-parts
    pattern: '```graphlet(?:(?!```)[\s\S])*?^[ \t]*[^\s:][^:\n]*:[ \t]*$'
    flags: 'm'
    match: 'not_contains'
  - type: regex
    name: no-frame-around-the-whole-graph
    pattern: '```graphlet[ \t]*\n[ \t]*[^\s:][^:\n]*:[ \t]*\n(?:[ \t]+\S[^\n]*\n)+[ \t]*```'
    flags: ''
    match: 'not_contains'
  - type: regex
    name: no-mermaid-in-the-block
    pattern: '```graphlet[^`]*?(?:^\s*(?:graph|flowchart)\s+(?:TD|LR|TB|RL|BT)|subgraph|==>|-\.->|:::|\[\(|\(\[|\{\{)'
    flags: 'mi'
    match: 'not_contains'
  - type: regex
    name: joins-ana-and-ben
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ana(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ben(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ben(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ana(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: joins-ana-and-cy
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ana(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Cy(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Cy(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ana(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: joins-ben-and-cy
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ben(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Cy(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Cy(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ben(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: joins-ben-and-dee
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ben(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Dee(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Dee(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ben(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: joins-dee-and-eli
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Dee(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Eli(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Eli(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Dee(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: no-link-between-ana-and-eli
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ana(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Eli(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Eli(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*-{2,}(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?Ana(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'not_contains'
  - type: llm
    name: says-who-could-introduce
    criteria: 'PASS if the reply says that Ben can introduce Ana to Dee, who knows Eli, or otherwise names the chain Ana, Ben, Dee, Eli as the way to reach Eli. FAIL otherwise.'
