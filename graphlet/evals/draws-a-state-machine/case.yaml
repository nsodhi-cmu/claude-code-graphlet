schema_version: '1.0'
name: draws-a-state-machine
description: 'States and transitions are answered with a graph block, loops included.'
tags: [draw]
execution:
  prompt: |
    What states does a TCP connection go through from opening to closing, and what moves it from one to the next? Keep it short.
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: []
  env:
    EVAL_GRAPHLET_GUIDE: '1'
runs: 3
graders:
  - type: regex
    name: writes-a-graph-block
    pattern: '^[ \t]*```graphlet[ \t]*$'
    flags: 'm'
    match: 'contains'
  - type: regex
    name: block-is-closed-with-a-link
    pattern: '^[ \t]*```graphlet[ \t]*\n(?:(?![ \t]*```)[^\n]*\n)*?[^\n]*(?:->|→)[^\n]*\n(?:(?![ \t]*```)[^\n]*\n)*?[ \t]*```[ \t]*$'
    flags: 'm'
    match: 'contains'
  - type: regex
    name: no-mermaid-in-the-block
    pattern: '```graphlet[^`]*?(?:^\s*(?:graph|flowchart)\s+(?:TD|LR|TB|RL|BT)|subgraph|==>|-\.->|:::|\[\(|\(\[|\{\{|\w\[[^\]\n]*\]\s*(?:-|$))'
    flags: 'mi'
    match: 'not_contains'
  - type: llm
    name: graph-answers-the-question
    criteria: 'Judge only the graph in the ```graphlet block. PASS if all of these hold: (1) its nodes are TCP connection states, such as CLOSED, LISTEN, SYN_SENT, SYN_RECEIVED, ESTABLISHED, FIN_WAIT_1, FIN_WAIT_2, CLOSE_WAIT, LAST_ACK, TIME_WAIT, written in any case; (2) it has at least five of them; (3) every -> link is a transition TCP really makes, from the first state to the second. It need not show every state or transition. FAIL if any does not hold.'
