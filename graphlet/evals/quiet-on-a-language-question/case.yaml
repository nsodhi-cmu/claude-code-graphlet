schema_version: '1.0'
name: quiet-on-a-language-question
description: 'A question with no graph in it gets no graph block.'
tags: [quiet]
execution:
  prompt: |
    What is the difference between let and const in JavaScript?
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: []
  env:
    EVAL_GRAPHLET_GUIDE: '1'
runs: 3
graders:
  - type: regex
    name: writes-no-graph-block
    pattern: '```graphlet'
    flags: 'i'
    match: 'not_contains'
