schema_version: '1.0'
name: draws-file-dependencies
description: 'Dependencies between files are answered with a graph block that has the right links.'
tags: [draw]
execution:
  prompt: |
    In my project, app.ts imports router.ts and config.ts; router.ts imports handlers.ts; handlers.ts imports db.ts and cache.ts; and db.ts imports config.ts.
    Which files are affected if I change config.ts? Show me how they depend on each other.
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: []
  env:
    EVAL_GRAPHLET_GUIDE: '1'
runs: 3
graders:
  - type: regex
    name: writes-a-graph-block
    pattern: '^[ \t]*```graphlet[ \t]*$'
    flags: 'm'
    match: 'contains'
  - type: regex
    name: block-is-closed-with-a-link
    pattern: '^[ \t]*```graphlet[ \t]*\n(?:(?![ \t]*```)[^\n]*\n)*?[^\n]*(?:-+>|→)[^\n]*\n(?:(?![ \t]*```)[^\n]*\n)*?[ \t]*```[ \t]*$'
    flags: 'm'
    match: 'contains'
  - type: regex
    name: no-frame-around-the-whole-graph
    pattern: '```graphlet[ \t]*\n[ \t]*[^\s:][^:\n]*:[ \t]*\n(?:[ \t]+\S[^\n]*\n)+[ \t]*```'
    flags: ''
    match: 'not_contains'
  - type: regex
    name: no-mermaid-in-the-block
    pattern: '```graphlet[^`]*?(?:^\s*(?:graph|flowchart)\s+(?:TD|LR|TB|RL|BT)|subgraph|==>|-\.->|:::|\[\(|\(\[|\{\{)'
    flags: 'mi'
    match: 'not_contains'
  - type: regex
    name: introduces-the-graph
    pattern: '^\s*[^\s`]'
    flags: ''
    match: 'contains'
  - type: regex
    name: links-app-and-router
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?app\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?router\.ts(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?router\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?app\.ts(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: links-app-and-config
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?app\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?config\.ts(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?config\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?app\.ts(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: links-router-and-handlers
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?router\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?handlers\.ts(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?handlers\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?router\.ts(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: links-handlers-and-db
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?handlers\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?db\.ts(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?db\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?handlers\.ts(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: links-handlers-and-cache
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?handlers\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?cache\.ts(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?cache\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?handlers\.ts(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: links-db-and-config
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?db\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?config\.ts(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?config\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?db\.ts(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'contains'
  - type: regex
    name: no-link-between-cache-and-config
    pattern: '```graphlet[^`]*?(?:(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?cache\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?config\.ts(?:\*\*)?(?![\w.])|(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?config\.ts(?:\*\*)?(?![\w.])(?:[ \t]*\[\w+\])?[ \t]*(?:-+>|→)(?:\|[^|\n]*\|)?[ \t]*(?<![\w.])(?:\*\*)?(?:[\w.-]*/)?cache\.ts(?:\*\*)?(?![\w.]))'
    flags: ''
    match: 'not_contains'
  - type: llm
    name: says-what-a-change-reaches
    criteria: 'PASS if the reply says that changing config.ts affects app.ts, router.ts, handlers.ts and db.ts, and does not affect cache.ts. FAIL otherwise.'
